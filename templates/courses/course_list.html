{% extends 'base.html' %}
{% block title %}Courses{% endblock %}
{% block content %}
<div class="container py-4">
    <h1 class="mb-4">All Courses</h1>
    <div class="row">
        <div class="col-md-3">
            <div class="card shadow-sm mb-4">
                <div class="card-body">
                    <h5>Filter</h5>
                    <form method="get">
                        <div class="mb-3">
                            <label class="form-label">Category</label>
                            <select name="category" class="form-select">
                                <option value="">All</option>
                                {% for cat in categories %}
                                <option value="{{ cat.slug }}" {% if request.GET.category == cat.slug %}selected{% endif %}>{{ cat.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Difficulty</label>
                            <select name="difficulty" class="form-select">
                                <option value="">All</option>
                                {% for diff, label in difficulties %}
                                <option value="{{ diff }}" {% if request.GET.difficulty == diff %}selected{% endif %}>{{ label }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Apply</button>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-md-9">
            <div class="row g-4">
                {% for course in courses %}
                <div class="col-md-6">
                    <div class="card h-100 shadow-sm">
                        <div class="card-body">
                            <h5 class="card-title">{{ course.title }}</h5>
                            <p class="text-muted small">{{ course.subtitle|truncatechars:80 }}</p>
                        </div>
                        <div class="card-footer bg-white">
                            <a href="{% url 'courses:course_detail' slug=course.slug %}" class="btn btn-sm btn-primary">View</a>
                        </div>
                    </div>
                </div>
                {% empty %}
                <p>No courses found.</p>
                {% endfor %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
